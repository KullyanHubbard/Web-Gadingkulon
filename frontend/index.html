<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SIGALON"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>SIGALON</title>
    <script>
      // Tema dipasang sebelum React mount, kalau tidak halaman berkedip putih
      // dulu tiap muat. Kuncinya sama dengan `components/layout/TombolTema.tsx`.
      try {
        var tema = localStorage.getItem('siduk.tema');
        if (
          tema === 'gelap' ||
          (!tema && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // localStorage diblokir (mode privat, dsb) — jalan terus dengan terang.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
